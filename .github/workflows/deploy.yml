name: Build & Deploy to Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/yogeshkukadiya92-stack/cfldashboard
  COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build on GitHub's fast runners, with layer cache reused between runs
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=https://dashboard.coachforlife.in
            NEXT_PUBLIC_RESET_DEMO_DATA=false

      # Tell Coolify to pull the new image and restart (no build on the server)
      - name: Trigger Coolify deploy
        if: ${{ env.COOLIFY_TOKEN != '' }}
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "https://panel.thecompletehealth.in/api/v1/deploy?uuid=jjs54swagmp8mzdoznnacwse&force=false"
